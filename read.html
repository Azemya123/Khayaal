<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facts & Assumptions — Khayaal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      color: #e8eaf0;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.9;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid #252d43;
      font-family: Arial, sans-serif;
    }

    header a {
      color: #c4c9d8;
      text-decoration: none;
    }

    main {
      max-width: 760px;
      margin: 55px auto;
      padding: 0 24px;
    }

    .story-title {
      color: #aab5d0;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    #chapter-number {
      color: #aab5d0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      margin-top: 30px;
    }

    #chapter-title {
      font-size: 27px;
      margin-bottom: 35px;
    }

    #chapter-content {
      font-size: 19px;
      white-space: pre-line;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 55px;
      padding-top: 25px;
      border-top: 1px solid #252d43;
    }

    button {
      background: #171f35;
      color: #e8eaf0;
      border: 1px solid #39445f;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button:not(:disabled):hover {
      background: #25314d;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #929bb0;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">← Back to Khayaal</a>
  </header>

  <main>
    <div class="story-title">Khayaal · Fiction</div>

    <h1>Facts &amp; Assumptions</h1>

    <p id="chapter-number"></p>
    <h2 id="chapter-title"></h2>

    <article id="chapter-content"></article>

    <div class="navigation">
      <button id="previous" onclick="changeChapter(-1)">
        ← Previous Chapter
      </button>

      <button id="next" onclick="changeChapter(1)">
        Next Chapter →
      </button>
    </div>
  </main>

  <footer>KHAYAAL — WHERE STORIES TAKE SHAPE</footer>

  <script>
    // ADD OR EDIT YOUR CHAPTERS HERE.
    // Replace the sample text with your actual writing.

    const chapters = [
      {
        title: "The Beginning",
        content: `Your Chapter One text goes here.

Separate paragraphs with a blank line.`
      },
      {
        title: "The Next Question",
        content: `Your Chapter Two text goes here.

You can write as many paragraphs as you need.`
      }
    ];

    let currentChapter = 0;

    function displayChapter() {
      const chapter = chapters[currentChapter];

      document.getElementById("chapter-number").textContent =
        "CHAPTER " + (currentChapter + 1);

      document.getElementById("chapter-title").textContent =
        chapter.title;

      document.getElementById("chapter-content").textContent =
        chapter.content;

      document.getElementById("previous").disabled =
        currentChapter === 0;

      document.getElementById("next").disabled =
        currentChapter === chapters.length - 1;

      window.scrollTo(0, 0);
    }

    function changeChapter(direction) {
      const nextChapter = currentChapter + direction;

      if (nextChapter >= 0 && nextChapter < chapters.length) {
        currentChapter = nextChapter;
        displayChapter();
      }
    }

    displayChapter();
  </script>
</body>
</html>
