  <script>
    const chapters = [
{
title: "The Beginning",
file: "chapters/chapter-1.txt"
},
{
title: "9:30 AM",
file: "chapters/chapter-2.txt"
},
{
title: "LOC’s Café",
file: "chapters/Chapter-3.txt"
}
];


    let currentChapter = 0;
    let loadNumber = 0;

    async function displayChapter() {
      const chapter = chapters[currentChapter];
      const thisLoad = ++loadNumber;

      const chapterNumber = document.getElementById("chapter-number");
      const chapterTitle = document.getElementById("chapter-title");
      const chapterContent = document.getElementById("chapter-content");
      const previousButton = document.getElementById("previous");
      const nextButton = document.getElementById("next");

      chapterNumber.textContent =
        "CHAPTER " + (currentChapter + 1);

      chapterTitle.textContent = chapter.title;
      chapterContent.textContent = "Loading chapter...";

      previousButton.disabled = currentChapter === 0;
      nextButton.disabled = currentChapter === chapters.length - 1;

      window.scrollTo(0, 0);

      updateChapterComments();

      try {
        const response = await fetch(chapter.file);

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const text = await response.text();

        // Ignore an older request if the reader has changed chapters.
        if (thisLoad !== loadNumber) {
          return;
        }

        chapterContent.textContent = text;
      } catch (error) {
        if (thisLoad !== loadNumber) {
          return;
        }

        chapterContent.textContent =
          "Sorry, this chapter couldn't be loaded. Please try again later.";

        console.error("Chapter loading error:", error);
      }
    }

    function updateChapterComments(attempt = 0) {
      const iframe = document.querySelector("iframe.giscus-frame");

      if (iframe) {
        iframe.contentWindow.postMessage(
          {
            giscus: {
              setConfig: {
                term:
                  "facts-assumptions-chapter-" +
                  (currentChapter + 1)
              }
            }
          },
          "https://giscus.app"
        );
      } else if (attempt < 20) {
        setTimeout(
          () => updateChapterComments(attempt + 1),
          500
        );
      }
    }

    function changeChapter(direction) {
      const nextChapter = currentChapter + direction;

      if (
        nextChapter >= 0 &&
        nextChapter < chapters.length
      ) {
        currentChapter = nextChapter;
        displayChapter();
      }
    }

    displayChapter();
  </script>
